<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عيد ميلاد سعيد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose:    #c0392b;
      --rose-lt: #e8577a;
      --gold:    #f0c040;
      --cream:   #fff5f0;
      --deep:    #6b1a2a;
      --mid:     #a0294a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--cream);
      background-image:
        radial-gradient(ellipse 60% 40% at 20% 10%, #fde8ec 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 90%, #fde8d0 0%, transparent 60%);
      font-family: 'Tajawal', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── BACKGROUND CANVAS (stars + ambient confetti) ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ── WRAPPER ── */
    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 3rem;
      width: 100%;
      max-width: 520px;
    }

    /* ── TITLE ── */
    .title {
      font-weight: 900;
      font-size: clamp(1.6rem, 6vw, 2.6rem);
      color: var(--deep);
      margin-bottom: 2rem;
      text-align: center;
      animation: fadeDown .8s ease both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SCENE ── */
    .scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp .9s .1s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── CANDLES ROW ── */
    .candles-row {
      display: flex;
      gap: 14px;
      align-items: flex-end;
      margin-bottom: 0px;
      position: relative;
      z-index: 5;
    }

    .candle-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform .15s;
    }
    .candle-wrap:hover { transform: scale(1.08); }

    /* FLAME */
    .flame-container {
      width: 18px;
      height: 28px;
      margin-bottom: 2px;
    }
    .flame-container svg { width: 18px; height: 28px; }
    .flame-flicker {
      animation: flicker 1.3s ease-in-out infinite alternate;
      transform-origin: 9px 26px;
    }
    @keyframes flicker {
      0%   { transform: scaleX(1)   scaleY(1)   rotate(-1deg); opacity: 1; }
      30%  { transform: scaleX(.84) scaleY(1.12) rotate(1.5deg); }
      60%  { transform: scaleX(1.1) scaleY(.94) rotate(-2deg); }
      100% { transform: scaleX(.9)  scaleY(1.08) rotate(2deg); opacity: .88; }
    }

    /* WICK */
    .wick {
      width: 2px;
      height: 6px;
      background: #555;
      border-radius: 1px;
    }

    /* CANDLE BODY */
    .candle-body {
      width: 16px;
      height: 48px;
      border-radius: 5px 5px 3px 3px;
      position: relative;
      overflow: hidden;
    }
    .candle-body::after {
      content: '';
      position: absolute;
      top: 0; left: 3px; right: 5px;
      height: 60%;
      border-radius: 2px;
      background: rgba(255,255,255,.3);
    }

    /* ── CAKE SVG ── */
    #cake-svg {
      display: block;
      overflow: visible;
      margin-top: -4px;
    }

    /* ── CONTROLS ── */
    .controls {
      margin-top: 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .7rem;
    }

    .btn-blow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: .65rem 1.8rem;
      background: var(--rose);
      color: #fff;
      border: none;
      border-radius: 60px;
      font-family: 'Tajawal', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(160,41,74,.35);
      transition: background .2s, transform .12s, box-shadow .2s;
    }
    .btn-blow:hover  { background: var(--deep); }
    .btn-blow:active { transform: scale(.96); }
    .btn-blow.listening {
      background: #c0392b;
      animation: pulse-ring 1.1s infinite;
    }
    @keyframes pulse-ring {
      0%,100% { box-shadow: 0 0 0 0 rgba(192,57,43,.45); }
      50%     { box-shadow: 0 0 0 12px rgba(192,57,43,0); }
    }

    .hint {
      font-size: .82rem;
      color: #a07080;
      text-align: center;
      line-height: 1.5;
    }

    /* ── MESSAGE ── */
    #msg-box {
      display: none;
      text-align: center;
      margin-top: 1.8rem;
      animation: popIn .65s cubic-bezier(.175,.885,.32,1.275) forwards;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.55) rotate(-4deg); }
      to   { opacity: 1; transform: scale(1)   rotate(0deg); }
    }
    .msg-card {
      background: #fff;
      border: 2px solid #f5c6d0;
      border-radius: 20px;
      padding: 1.4rem 2rem;
      box-shadow: 0 8px 32px rgba(160,41,74,.12);
    }
    .msg-emoji { font-size: 2.2rem; display: block; margin-bottom: .4rem; }
    .msg-text  {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.05rem, 3.5vw, 1.4rem);
      color: var(--deep);
      line-height: 1.65;
      direction: rtl;
      unicode-bidi: plaintext;
    }

    /* ── BURST CONFETTI (on win) ── */
    .conf {
      position: fixed;
      top: -12px;
      pointer-events: none;
      z-index: 9999;
      animation: confFall linear forwards;
    }
    @keyframes confFall {
      to { transform: translateY(110vh) rotate(900deg); opacity: 0; }
    }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="wrapper">
  <h1 class="title">كل عام وانت بألف خير ✨♥️</h1>

  <div class="scene">

    <!-- CANDLES -->
    <div class="candles-row" id="candles-row"></div>

      <path d="M68,86 Q88,78 108,86 Q128,94 148,86 Q168,78 188,86 Q208,94 228,86 Q248,78 252,86"
            fill="none" stroke="rgba(255,220,100,.45)" stroke-width="2" stroke-linecap="round"/>

      <!-- ═══ TOP LAYER ═══ -->
      <rect x="55" y="14"  width="210" height="46" rx="14" fill="#f4728a"/>
      <!-- drip top of top layer -->
      <path d="M55,14
               Q72,0   89,14
               Q106,0  123,14
               Q140,0  157,14

               Q242,0  265,14"
            fill="none" stroke="#f98fa3" stroke-width="13" stroke-linecap="round"/>
      <!-- shine -->
      <rect x="55" y="14"  width="210" height="46" rx="14" fill="url(#shineT)" clip-path="url(#clipT)"/>

      <!-- ═══ PLATE ═══ -->
      <ellipse cx="160" cy="171" rx="168" ry="9" fill="#c2956e"/>

    <!-- MESSAGE -->
    <div id="msg-box">
      <div class="msg-card">

    <!-- CONTROLS -->
    <div class="controls" id="controls">
      <button class="btn-blow" onclick="showMessage()">

  </div><!-- /scene -->
</div><!-- /wrapper -->

<script>
/* ══════════════════════════════════════
   ★  EDIT YOUR MESSAGE HERE  ★
══════════════════════════════════════ */
var TEXTMSG = "كل سنة وانت بألف خير يروحي ❤️ بتمنالك أجمل سنة وأحلى أيام الله يخليلي ياك ونقضي كل ايامنا سوا وتحقق كل اللي بتتمناه بحبك كتيير 🎂✨";
/* ══════════════════════════════════════ */

/* ★  BACKGROUND SONG / SOUND EFFECT  ★
   Replace the URL below to use a different song or sound.        */
var SOUNDANDSONG = "song.mp3";

var _bgAudio = new Audio(SOUNDANDSONG);
_bgAudio.loop   = true;
_bgAudio.volume = 0.45;

/* Web Audio API fallback — plays Happy Birthday melody if mp3 fails to load */
function _playFallbackMelody() {
  var ac = new (window.AudioContext || window.webkitAudioContext)();
  /* [frequency Hz, note duration s, gap after s] */
  var notes = [
    [264,0.25,0.05],[264,0.25,0.05],[297,0.5,0.1],[264,0.5,0.1],[352,0.5,0.1],[330,1,0.2],
    [264,0.25,0.05],[264,0.25,0.05],[297,0.5,0.1],[264,0.5,0.1],[396,0.5,0.1],[352,1,0.2],
    [264,0.25,0.05],[264,0.25,0.05],[528,0.5,0.1],[440,0.5,0.1],[352,0.5,0.1],[330,0.5,0.1],[297,1,0.2],
    [470,0.25,0.05],[470,0.25,0.05],[440,0.5,0.1],[352,0.5,0.1],[396,0.5,0.1],[352,1,0.3]
  ];
  var t = ac.currentTime + 0.1;
  notes.forEach(function(n) {
    var osc  = ac.createOscillator();
    var gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(n[0], t);
    gain.gain.setValueAtTime(0.18, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + n[1]);
    osc.start(t);
    osc.stop(t + n[1]);
    t += n[1] + n[2];
  });
}

function _tryPlayBg() {
  _bgAudio.play().catch(function() {
    _playFallbackMelody();
  });
  document.removeEventListener('click',      _tryPlayBg);
  document.removeEventListener('touchstart', _tryPlayBg);
}
document.addEventListener('click',      _tryPlayBg);
document.addEventListener('touchstart', _tryPlayBg);

var CANDLE_COLORS = ['#e74c3c','#e74c3c','#e74c3c','#e74c3c','#e74c3c','#e74c3c'];
var NUM_CANDLES   = 6;
var blown         = new Array(NUM_CANDLES).fill(false);
var allBlown      = false;
var listening     = false;
var audioCtx, analyser, micStream, rafId;

/* ══ Build candles ══ */
function buildCandles() {
  var row = document.getElementById('candles-row');
  row.innerHTML = '';
  for (var i = 0; i < NUM_CANDLES; i++) {
    (function(idx) {
      var color = CANDLE_COLORS[idx];
      var wrap  = document.createElement('div');
      wrap.className = 'candle-wrap';
      wrap.title = 'انقر لإطفاء الشمعة';
      wrap.onclick = function() { blowCandle(idx); };
      wrap.innerHTML =
        '<div class="flame-container" id="flame-' + idx + '">' +
          '<svg viewBox="0 0 18 28" xmlns="http://www.w3.org/2000/svg">' +
            '<defs>' +
              '<radialGradient id="rg' + idx + '" cx="50%" cy="75%" r="65%">' +
                '<stop offset="0%"   stop-color="#fffde7"/>' +
                '<stop offset="35%"  stop-color="#ffb347"/>' +
                '<stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>' +
              '</radialGradient>' +
            '</defs>' +
            '<g class="flame-flicker">' +
              '<ellipse cx="9" cy="18" rx="7"   ry="10" fill="url(#rg' + idx + ')" opacity=".88"/>' +
              '<ellipse cx="9" cy="13" rx="4"   ry="8"  fill="#ffe066" opacity=".8"/>' +
              '<ellipse cx="9" cy="7"  rx="2.5" ry="5"  fill="#fff9c4" opacity=".9"/>' +
              '<circle  cx="9" cy="4"  r="2"    fill="#ffffff"/>' +
            '</g>' +
          '</svg>' +
        '</div>' +
        '<div class="wick"></div>' +
        '<div class="candle-body" style="background:' + color + '"></div>';
      row.appendChild(wrap);
    })(i);
  }
}

/* ══ Blow one candle ══ */
function blowCandle(i) {
  if (blown[i] || allBlown) return;
  blown[i] = true;
  var fl = document.getElementById('flame-' + i);
  if (fl) {
    fl.style.transition = 'opacity .3s, transform .3s';
    fl.style.opacity    = '0';
    fl.style.transform  = 'scaleY(0) translateY(-10px)';
    setTimeout(function() { if (fl) fl.style.display = 'none'; }, 320);
  }
  if (blown.every(Boolean)) setTimeout(showMessage, 500);
}

/* ══ Show message ══ */
function showMessage() {
  if (allBlown) return;
  allBlown = true;
  document.getElementById('controls').style.display = 'none';
  document.getElementById('msg-text').textContent = TEXTMSG;
  document.getElementById('msg-box').style.display = 'block';
  burstConfetti();
}

/* ══ Burst confetti (win) ══ */
function burstConfetti() {
  var colors = ['#e74c3c','#f1c40f','#3498db','#2ecc71','#9b59b6','#e67e22','#e8577a','#ff8fab','#fff'];
  for (var i = 0; i < 120; i++) {
    (function(delay) {
      setTimeout(function() {
        var c  = document.createElement('div');
        c.className = 'conf';
        var size   = 5 + Math.random() * 9;
        var isCirc = Math.random() > .45;
        c.style.cssText =
          'left:'   + (Math.random() * 100) + '%;' +
          'width:'  + size + 'px;height:' + (isCirc ? size : size * 0.4 + 3) + 'px;' +
          'background:' + colors[Math.floor(Math.random() * colors.length)] + ';' +
          'animation-duration:' + (1.4 + Math.random() * 2) + 's;' +
          'border-radius:' + (isCirc ? '50%' : '2px') + ';' +
          'opacity:1;';
        document.body.appendChild(c);
        setTimeout(function() { c.remove(); }, 5000);
      }, delay);
    })(i * 22);
  }
}

/* ══ Microphone ══ */
async function startListen() {
  if (allBlown) return;
  if (listening) { stopListen(); return; }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    listening = true;
    document.getElementById('mic-btn').classList.add('listening');
    document.getElementById('btn-label').textContent  = 'جاري الاستماع... (انقر للإيقاف)';
    document.getElementById('hint-text').textContent  = 'انفخ في الميكروفون لإطفاء الشمعات! 💨';
    detectBlow();
  } catch(e) {
    var rem = blown.map(function(b,i){ return b?-1:i; }).filter(function(i){ return i>=0; });
    if (rem.length) blowCandle(rem[0]);
  }
}

function stopListen() {
  listening = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (micStream) micStream.getTracks().forEach(function(t){ t.stop(); });
  if (audioCtx)  audioCtx.close();
  var btn = document.getElementById('mic-btn');
  if (btn) {
    btn.classList.remove('listening');
    document.getElementById('btn-label').textContent = '🌟';
  }
  var hint = document.getElementById('hint-text');
  if (hint) hint.textContent = 'انقر واستمر بالنفخ في الميكروفون، أو انقر على كل شمعة لإطفائها';
}

function detectBlow() {
  if (!listening) return;
  var data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  var avg = data.reduce(function(a,b){ return a+b; }, 0) / data.length;

  for (var i = 0; i < NUM_CANDLES; i++) {
    if (blown[i]) continue;
    var fl = document.getElementById('flame-' + i);
    if (!fl) continue;
    fl.style.transform = avg > 8 ? 'translateX(' + ((Math.random()-.5)*avg*.35) + 'px)' : '';
  }

  if (avg > 20) {
    var rem = blown.map(function(b,i){ return b?-1:i; }).filter(function(i){ return i>=0; });
    if (rem.length) blowCandle(rem[0]);
    if (blown.every(Boolean)) { showMessage(); return; }
  }
  rafId = requestAnimationFrame(detectBlow);
}

/* ══ Background canvas: floating particles + ambient mini-confetti ══ */
(function() {
  var canvas = document.getElementById('bg-canvas');
  var ctx    = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  /* ── Floating sparkle dots ── */
  var sparkleColors = ['#e8577a','#f0c040','#c0392b','#ffb6c1','#ffb347','#fff'];
  var sparkles = [];
  for (var i = 0; i < 35; i++) {
    sparkles.push({
      x:  Math.random() * canvas.width,
      y:  Math.random() * canvas.height,
      r:  .7 + Math.random() * 1.8,
      vx: (Math.random() - .5) * .22,
      vy: -.08 - Math.random() * .18,
      a:  .07 + Math.random() * .2,
      color: sparkleColors[Math.floor(Math.random() * sparkleColors.length)]
    });
  }

  /* ── Ambient mini confetti pieces ── */
  var confColors = ['#e8577a','#f1c40f','#3498db','#2ecc71','#9b59b6','#ff8fab','#e67e22','#c0392b'];
  var pieces = [];
  for (var j = 0; j < 28; j++) {
    pieces.push(makePiece(true));
  }

  function makePiece(scattered) {
    var isRect = Math.random() > .4;
    return {
      x:    Math.random() * (canvas.width || window.innerWidth),
      y:    scattered ? Math.random() * (canvas.height || window.innerHeight) : -10,
      w:    isRect ? 5 + Math.random() * 6 : 4 + Math.random() * 4,
      h:    isRect ? 2 + Math.random() * 3 : 4 + Math.random() * 4,
      isRect: isRect,
      rot:  Math.random() * Math.PI * 2,
      rotV: (Math.random() - .5) * .06,
      vx:   (Math.random() - .5) * .5,
      vy:   .35 + Math.random() * .55,
      a:    0.18 + Math.random() * 0.35,
      color: confColors[Math.floor(Math.random() * confColors.length)]
    };
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    /* sparkles */
    sparkles.forEach(function(s) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.a;
      ctx.fill();
      s.x += s.vx; s.y += s.vy;
      if (s.y < -4)            { s.y = canvas.height + 4; s.x = Math.random()*canvas.width; }
      if (s.x < 0)              s.x = canvas.width;
      if (s.x > canvas.width)   s.x = 0;
    });

    /* ambient confetti */
    pieces.forEach(function(p, idx) {
      ctx.save();
      ctx.globalAlpha = p.a;
      ctx.translate(p.x + p.w/2, p.y + p.h/2);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.isRect) {
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.w/2, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
      p.x   += p.vx;
      p.y   += p.vy;
      p.rot += p.rotV;
      if (p.y > canvas.height + 10) {
        pieces[idx] = makePiece(false);
      }
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();

buildCandles();
</script>
</body>
